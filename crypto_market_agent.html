<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Pulse — AI Crypto Briefing Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E14;
    --panel: #12161F;
    --panel-border: #1E2530;
    --gold: #F0B90B;
    --up: #2EBD85;
    --down: #F6465D;
    --text-primary: #EAECEF;
    --text-secondary: #848E9C;
    --text-tertiary: #5E6673;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 20px 60px;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .brand-mark {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.15);
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin: 0;
    padding-left: 19px;
  }

  .meta {
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }

  .timestamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .refresh-btn {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .refresh-btn:hover:not(:disabled) {
    border-color: var(--gold);
    color: var(--gold);
  }

  .refresh-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .refresh-icon {
    width: 13px;
    height: 13px;
    transition: transform 0.6s ease;
  }

  .refresh-btn.spinning .refresh-icon {
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Ticker strip */
  .ticker-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
    margin-bottom: 32px;
  }

  .ticker-cell {
    padding: 18px 16px;
    border-right: 1px solid var(--panel-border);
  }

  .ticker-cell:last-child {
    border-right: none;
  }

  .ticker-symbol {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .ticker-price {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }

  .ticker-change {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .ticker-change.up { color: var(--up); }
  .ticker-change.down { color: var(--down); }

  .skeleton {
    background: linear-gradient(90deg, #1a2029 25%, #212936 37%, #1a2029 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 4px;
    height: 14px;
    width: 70%;
  }

  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Report */
  .report-panel {
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    background: var(--panel);
    padding: 28px 30px;
  }

  .report-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .report-sub {
    color: var(--text-secondary);
    font-size: 13px;
    margin: 0 0 20px;
  }

  .report-body {
    font-size: 15px;
    line-height: 1.7;
    color: #D5D8DD;
    white-space: pre-wrap;
  }

  .report-body p { margin: 0 0 14px; }
  .report-body p:last-child { margin-bottom: 0; }

  .placeholder-lines {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .placeholder-lines .skeleton { height: 12px; }
  .placeholder-lines .skeleton:nth-child(1) { width: 95%; }
  .placeholder-lines .skeleton:nth-child(2) { width: 88%; }
  .placeholder-lines .skeleton:nth-child(3) { width: 92%; }
  .placeholder-lines .skeleton:nth-child(4) { width: 60%; }

  .error-box {
    color: var(--down);
    font-size: 14px;
    background: rgba(246, 70, 93, 0.08);
    border: 1px solid rgba(246, 70, 93, 0.25);
    padding: 14px 16px;
    border-radius: 8px;
  }

  footer {
    margin-top: 24px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 12px;
  }

  footer span { color: var(--text-secondary); }

  @media (max-width: 560px) {
    h1 { font-size: 21px; }
    header { align-items: flex-start; }
    .meta { align-items: flex-start; text-align: left; }
    .report-panel { padding: 22px 18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">
        <span class="brand-dot"></span>
        <h1>Market Pulse</h1>
      </div>
      <p class="subtitle">An AI agent that reads live Binance data and briefs you on it</p>
    </div>
    <div class="meta">
      <span class="timestamp" id="timestamp">—</span>
      <button class="refresh-btn" id="refreshBtn" onclick="runAgent()">
        <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-3-6.7"/>
          <path d="M21 3v6h-6"/>
        </svg>
        <span id="refreshLabel">Refresh</span>
      </button>
    </div>
  </header>

  <div class="ticker-strip" id="tickerStrip"></div>

  <div class="report-panel">
    <p class="report-label">Daily market brief</p>
    <p class="report-sub" id="reportSub">Written by Claude from the live prices above</p>
    <div class="report-body" id="reportBody">
      <div class="placeholder-lines">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </div>
  </div>

  <footer>Prices pulled directly from Binance's public market API. <span>No account or login involved.</span></footer>

</div>

<script>
const SYMBOLS = ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT"];
const LABELS = { BTCUSDT: "BTC", ETHUSDT: "ETH", BNBUSDT: "BNB", SOLUSDT: "SOL", XRPUSDT: "XRP" };

function renderTickerSkeleton() {
  const strip = document.getElementById('tickerStrip');
  strip.innerHTML = SYMBOLS.map(sym => `
    <div class="ticker-cell">
      <div class="ticker-symbol">${LABELS[sym]}</div>
      <div class="skeleton" style="height:18px; margin-bottom:8px;"></div>
      <div class="skeleton" style="height:13px; width:40%;"></div>
    </div>
  `).join('');
}

function formatPrice(p) {
  const n = parseFloat(p);
  if (n >= 100) return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
  if (n >= 1) return n.toFixed(2);
  return n.toFixed(4);
}

async function fetchMarketData() {
  const results = [];
  for (const sym of SYMBOLS) {
    const res = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${sym}`);
    if (!res.ok) throw new Error(`Binance API error for ${sym}: ${res.status}`);
    const data = await res.json();
    results.push({
      symbol: LABELS[sym],
      pair: sym,
      price: formatPrice(data.lastPrice),
      changePercent: parseFloat(data.priceChangePercent),
      high: formatPrice(data.highPrice),
      low: formatPrice(data.lowPrice),
      quoteVolume: parseFloat(data.quoteVolume)
    });
  }
  return results;
}

function renderTicker(data) {
  const strip = document.getElementById('tickerStrip');
  strip.innerHTML = data.map(d => {
    const dir = d.changePercent >= 0 ? 'up' : 'down';
    const arrow = d.changePercent >= 0 ? '▲' : '▼';
    return `
      <div class="ticker-cell">
        <div class="ticker-symbol">${d.symbol}</div>
        <div class="ticker-price">$${d.price}</div>
        <div class="ticker-change ${dir}">${arrow} ${Math.abs(d.changePercent).toFixed(2)}%</div>
      </div>
    `;
  }).join('');
}

function renderReportSkeleton() {
  document.getElementById('reportBody').innerHTML = `
    <div class="placeholder-lines">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  `;
}

function renderReportText(text) {
  const paragraphs = text.split(/\n\n+/).filter(Boolean);
  document.getElementById('reportBody').innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');
}

function renderReportError(message) {
  document.getElementById('reportBody').innerHTML = `<div class="error-box">${message}</div>`;
}

async function generateBrief(marketData) {
  const summaryLines = marketData.map(d =>
    `${d.symbol}: $${d.price}, 24h change ${d.changePercent >= 0 ? '+' : ''}${d.changePercent.toFixed(2)}%, 24h range $${d.low}–$${d.high}, quote volume $${Math.round(d.quoteVolume).toLocaleString()}`
  ).join('\n');

  const prompt = `You are a crypto market analyst agent. Here is live 24-hour data pulled from Binance for five major assets:

${summaryLines}

Write a short daily market brief (3 short paragraphs, no headers, no markdown formatting, no bullet points) in plain prose:
1. Overall market mood today across these assets.
2. The single most notable mover and a plausible read on why it stands out (price action only, no invented news).
3. One balanced, non-prescriptive closing observation. Do not give financial advice or tell the reader to buy or sell anything.

Keep the tone calm and analytical, like a morning trading desk note. Return only the three paragraphs of prose, separated by a blank line.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }]
    })
  });

  if (!response.ok) throw new Error(`AI analysis request failed: ${response.status}`);
  const data = await response.json();
  const textBlock = data.content.find(b => b.type === "text");
  if (!textBlock) throw new Error("No text returned from the model.");
  return textBlock.text;
}

function setTimestamp() {
  const now = new Date();
  document.getElementById('timestamp').textContent =
    'Last updated ' + now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

async function runAgent() {
  const btn = document.getElementById('refreshBtn');
  const label = document.getElementById('refreshLabel');
  btn.disabled = true;
  btn.classList.add('spinning');
  label.textContent = 'Working…';
  renderTickerSkeleton();
  renderReportSkeleton();

  try {
    const marketData = await fetchMarketData();
    renderTicker(marketData);
    setTimestamp();

    try {
      const brief = await generateBrief(marketData);
      renderReportText(brief);
    } catch (aiErr) {
      renderReportError("Prices loaded, but the AI analysis step failed: " + aiErr.message);
    }
  } catch (err) {
    document.getElementById('tickerStrip').innerHTML =
      `<div class="ticker-cell" style="grid-column: 1 / -1;"><div class="error-box">Couldn't reach Binance's public API: ${err.message}</div></div>`;
    renderReportError("Skipped — waiting on price data.");
  } finally {
    btn.disabled = false;
    btn.classList.remove('spinning');
    label.textContent = 'Refresh';
  }
}

renderTickerSkeleton();
runAgent();
</script>
</body>
</html>
